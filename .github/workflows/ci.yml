name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PatchGuard.slnx

      - name: Build
        run: dotnet build PatchGuard.slnx --no-restore -c Release

      - name: Test
        run: dotnet test PatchGuard.Tests/PatchGuard.Tests.csproj --no-build -c Release --verbosity normal
